name: Shared script integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked runtime dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Verify declared snapshots and source syntax
        run: |
          python scripts/sync_shared_scripts.py check
          node scripts/check_shared_scripts.mjs
      - name: Run isolated behavior regressions
        run: |
          python -m unittest discover -s scripts/tests -v
          uv run --frozen python -m unittest discover -s runtime/tests -v
